[project]
name = "pavico_packages"
authors = [{ name = "Pavico LLP", email = "support@pavico.in" }]
description = "Pavico Package Builder inside ERPNext: itineraries, rate sheet and travel quotes"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["anthropic>=2.8,<3"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
